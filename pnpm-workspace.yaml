packages:
  - apps/*
  - packages/*
  - tooling/*

catalogs:
  build:
    '@tailwindcss/forms': 0.5.11
    '@tailwindcss/postcss': 4.3.5
    tailwindcss: 4.3.5
  framework:
    '@next/eslint-plugin-next': 16.4.6
    next: 16.4.6
    react: 19.3.1
    react-dom: 19.3.1
  frontend:
    '@headlessui/react': 2.2.10
    geist: 1.9.2
    motion: 14.14.0
    next-themes: 0.4.6
    react-hotkeys-hook: 5.4.0
    sonner: 2.0.8
    tailwind-merge: 3.7.0
    tw-animate-css: 1.4.0
  lint:
    '@eslint/js': 10.0.1
    eslint: 10.15.0
    prettier: 3.10.1
    prettier-plugin-tailwindcss: 0.8.1
    typescript-eslint: 8.73.0
  prod:
    '@t3-oss/env-nextjs': 0.13.11
  script:
    dotenv-cli: 11.1.0
    jiti: 2.7.0
  types:
    '@types/lodash': 4.17.27
    '@types/node': 22.20.5
    '@types/react': 19.3.0
    '@types/react-dom': 19.3.0
