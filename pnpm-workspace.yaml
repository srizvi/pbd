packages:
  - apps/*
  - packages/*
  - tooling/*

nodeLinker: hoisted

allowBuilds:
  esbuild: true
  sharp: true

# GHSA-rj75-hqrm-r3gf: Typography 0.5.20 pins vulnerable 6.0.10.
# 6.1.5 is the upstream security backport: https://github.com/postcss/postcss-selector-parser/releases/tag/6.1.5
# Retire when Typography permits 6.1.5 or newer without an override.
overrides:
  '@tailwindcss/typography@0.5.20>postcss-selector-parser': 6.1.5
